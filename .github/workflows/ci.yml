name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local:
    name: Real local execution (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    defaults:
      run:
        shell: bash
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.19.0'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Check real execution prerequisites
        run: |
          mkdir -p "$RUNNER_TEMP/paper2-ci"
          node --version
          python3 --version
          python3 -c 'import ensurepip, sys, venv; assert sys.version_info >= (3, 10)'
          command -v tar
          command -v ps
          if [[ "$RUNNER_OS" == Linux ]]; then command -v setsid; fi
          echo "PYTHON=$(command -v python3)" >> "$GITHUB_ENV"
      - name: Install locked dependencies
        run: npm ci 2>&1 | tee "$RUNNER_TEMP/paper2-ci/install.log"
      - name: Build and typecheck
        run: npm run build 2>&1 | tee "$RUNNER_TEMP/paper2-ci/build.log"
      - name: Run node:test suite (real POSIX processes included)
        run: npm test 2>&1 | tee "$RUNNER_TEMP/paper2-ci/tests.log"
      - name: Require Linux detached watchdog test to pass without skips
        if: runner.os == 'Linux'
        run: |
          node --import tsx --test --test-reporter=tap \
            --test-name-pattern='^detached remote launch polls absolute PID and independent watchdog KILLs a TERM-ignoring workload$' \
            tests/vast-lifecycle.test.ts 2>&1 | tee "$RUNNER_TEMP/paper2-ci/watchdog.tap"
          # Fail if the test was renamed, skipped, or silently stopped executing.
          grep -Eq '^# pass 1$' "$RUNNER_TEMP/paper2-ci/watchdog.tap"
          grep -Eq '^# skipped 0$' "$RUNNER_TEMP/paper2-ci/watchdog.tap"
      - name: Real Python smoke and scientific reproducibility
        env:
          PAPER2_SMOKE_DIAGNOSTICS: ${{ runner.temp }}/paper2-ci/smoke
        run: npm run smoke 2>&1 | tee "$RUNNER_TEMP/paper2-ci/smoke.log"
      - name: Upload allowlisted diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: failure-${{ matrix.os }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/paper2-ci/install.log
            ${{ runner.temp }}/paper2-ci/build.log
            ${{ runner.temp }}/paper2-ci/tests.log
            ${{ runner.temp }}/paper2-ci/watchdog.tap
            ${{ runner.temp }}/paper2-ci/smoke.log
            ${{ runner.temp }}/paper2-ci/smoke/
